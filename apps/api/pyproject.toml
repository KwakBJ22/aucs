[project]
name = "aucs-api"
version = "0.1.0"
description = "옥스 API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.1",
  "httpx>=0.28",
  "aucs-rules",
  "aucs-workers",
  "python-multipart>=0.0.9",
]

[tool.uv.sources]
aucs-rules = { workspace = true }
aucs-workers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
